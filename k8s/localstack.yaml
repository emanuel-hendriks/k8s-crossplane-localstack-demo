apiVersion: v1
kind: Namespace
metadata:
  name: localstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:latest
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: "sns,sqs,dynamodb"
        - name: DEBUG
          value: "1"
        - name: AWS_DEFAULT_REGION
          value: "eu-central-1"
        - name: PERSISTENCE
          value: "0"
        - name: DATA_DIR
          value: "/tmp/localstack/data"
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack
spec:
  selector:
    app: localstack
  ports:
  - port: 4566
    targetPort: 4566
  type: ClusterIP 